name: Build and Check

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      upload-artifact:
        description: Upload the generated dist directory
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Verify build output
        shell: bash
        run: |
          test -d dist
          test -f dist/index.html

      - name: Upload build artifact
        if: github.event_name != 'pull_request' || inputs.upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: astro-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7
